name: waterwise

services:
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
    environment:
      APP_MODE: ${APP_MODE:-demo}
      DEMO_AUTOSTART: ${DEMO_AUTOSTART:-true}
      API_KEY: ${API_KEY:?Run ./scripts/bootstrap.sh first}
      DATA_DIR: /app/data
      DAILY_QUOTA_L: ${DAILY_QUOTA_L:-150}
      TANK_CAPACITY_L: ${TANK_CAPACITY_L:-200}
      QUOTA_TIMEZONE: ${QUOTA_TIMEZONE:-Asia/Kolkata}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Run ./scripts/bootstrap.sh first}
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Run ./scripts/bootstrap.sh first}
      INFLUX_ORG: ${INFLUX_ORG:-waterwise}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-water_telemetry}
    volumes:
      - backend_data:/app/data
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  mosquitto:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_PORT:-1883}:1883"
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Run ./scripts/bootstrap.sh first}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./.secrets/mosquitto.passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'mosquitto_pub -h 127.0.0.1 -p 1883 -u "$${MQTT_USERNAME}" -P "$${MQTT_PASSWORD}" -t watertank/_health -m healthy -q 1'
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  influxdb:
    image: influxdb:2.7
    restart: unless-stopped
    ports:
      - "${INFLUX_BIND_ADDRESS:-127.0.0.1}:${INFLUX_PORT:-8086}:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-waterwise}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:?Run ./scripts/bootstrap.sh first}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-waterwise}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-water_telemetry}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:?Run ./scripts/bootstrap.sh first}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-30d}
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run ./scripts/bootstrap.sh first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 5s
      INFLUX_ORG: ${INFLUX_ORG:-waterwise}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-water_telemetry}
      INFLUX_TOKEN: ${INFLUX_TOKEN:?Run ./scripts/bootstrap.sh first}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  backend_data:
  mosquitto_data:
  influxdb_data:
  influxdb_config:
  grafana_data:
