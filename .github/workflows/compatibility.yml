name: Platform compatibility

on:
  push:
    branches: [windows, trijal]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application:
    name: Application (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: WaterWise Project
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          path: WaterWise Project
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Set up project on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1
      - name: Set up project on Linux
        if: runner.os != 'Windows'
        run: python scripts/manage.py setup
      - name: Select project environment
        shell: python
        run: |
          import os
          from pathlib import Path
          directory = Path('.venv') / ('Scripts' if os.name == 'nt' else 'bin')
          with open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8') as stream:
              stream.write(str(directory.resolve()) + '\n')
      - name: Backend and portability regression tests
        run: python -m pytest -q
      - name: Windows launcher argument forwarding
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess
          from pathlib import Path
          for name in ('setup', 'run-demo', 'bootstrap'):
              for suffix in ('ps1', 'cmd'):
                  script = Path('scripts') / (name + '.' + suffix)
                  command = ['pwsh', '-NoProfile', '-File', str(script)] if suffix == 'ps1' else [str(script.resolve())]
                  subprocess.run(command + ['--help'], check=True)
      - name: Lint
        run: python -m ruff check backend tests scripts firmware/esp32/build.py firmware/esp32/test_native.py
      - name: Formatting
        run: python -m ruff format --check backend tests scripts firmware/esp32/build.py firmware/esp32/test_native.py
      - uses: actions/setup-node@v4
        if: matrix.python == '3.12'
        with:
          node-version: '22'
      - name: Install browser checks
        if: matrix.python == '3.12'
        run: python scripts/browser_tests.py install
      - name: Browser integration and accessibility
        if: matrix.python == '3.12'
        run: python scripts/browser_tests.py run
      - name: Browser reports
        if: always() && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ runner.os }}
          path: |
            WaterWise Project/.runtime/browser/server.log
            WaterWise Project/.runtime/browser/results.json
            WaterWise Project/.runtime/browser/screenshots/
            WaterWise Project/.runtime/browser/two-tank/
            WaterWise Project/.runtime/dark-review/
          if-no-files-found: ignore

  firmware:
    name: Firmware (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Native control-logic tests
        if: runner.os != 'Windows'
        run: python firmware/esp32/test_native.py
      - name: Native control-logic tests through PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./firmware/esp32/test-native.ps1
      - name: Install firmware tools
        run: python -m pip install platformio==6.1.18
      - name: Compile ESP32 example configuration
        if: runner.os != 'Windows'
        run: python firmware/esp32/build.py
      - name: Compile ESP32 through PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./firmware/esp32/build.ps1
      - name: Compile commissioned relay and float configurations
        shell: python
        run: |
          import subprocess
          import sys
          from pathlib import Path
          target = Path('firmware/esp32/include/config.h')
          assert not target.exists(), 'Do not overwrite a private hardware configuration'
          example = Path('firmware/esp32/include/config.example.h').read_text()
          try:
              for high, tls, role in [(1, 0, 'RECEIVER_FULL'), (0, 1, 'SOURCE_LOW')]:
                  config = example.replace('WATER_HARDWARE_COMMISSIONED 0', 'WATER_HARDWARE_COMMISSIONED 1')
                  config = config.replace('WATER_WIFI_SSID "CHANGE_ME"', 'WATER_WIFI_SSID "BUILD_CHECK_ONLY"')
                  config = config.replace('WATER_MQTT_PASSWORD "CHANGE_ME"', 'WATER_MQTT_PASSWORD "BUILD_CHECK_ONLY"')
                  config = config.replace('WATER_RELAY_ACTIVE_HIGH 1', f'WATER_RELAY_ACTIVE_HIGH {high}')
                  config = config.replace('WATER_MQTT_TLS 0', f'WATER_MQTT_TLS {tls}')
                  config = config.replace('WATER_FLOAT_ROLE WATER_FLOAT_ROLE_RECEIVER_FULL', f'WATER_FLOAT_ROLE WATER_FLOAT_ROLE_{role}')
                  target.write_text(config)
                  subprocess.run([sys.executable, 'firmware/esp32/build.py'], check=True)
          finally:
              target.unlink(missing_ok=True)

  deployment:
    name: Docker full stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: waterwise-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate credentials and validate Compose
        run: python scripts/manage.py bootstrap
      - name: Start isolated full stack
        run: docker compose up --build --wait --wait-timeout 240
      - name: Verify real service integrations
        shell: python
        run: |
          import json
          import time
          from datetime import datetime, timezone
          import urllib.parse
          import urllib.request
          from pathlib import Path
          values = dict(line.split('=', 1) for line in Path('.env').read_text().splitlines()
                        if '=' in line and not line.startswith('#'))
          def request(path, payload=None):
              body = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request('http://127.0.0.1:8000' + path, data=body,
                  headers={'Content-Type': 'application/json', 'X-API-Key': values['API_KEY']})
              with urllib.request.urlopen(req, timeout=10) as response:
                  return json.load(response)
          health = request('/health/ready')
          assert health['ready'] and health['mqtt_connected'] and health['influx_connected'], health
          request('/api/demo', {'action': 'scenario', 'scenario': 'leak'})
          for _ in range(30):
              latest = request('/devices/tank-01/latest')
              if latest['decision']['flat_status'] == 'LEAK_ALERT':
                  break
              time.sleep(1)
          assert latest['decision']['flat_status'] == 'LEAK_ALERT', latest
          assert latest['decision']['flat_valve_percent'] == 25, latest
          stopped = request('/telemetry', {
              'device_id': 'transfer-rig', 'flat_id': '101',
              'timestamp': datetime.now(timezone.utc).isoformat(),
              'level_percent': 80, 'volume_l': 2, 'flow_lpm': 0, 'flow_out_lpm': 0,
              'ultrasonic_distance_cm': 34, 'sensor_status': 'ok', 'valve_percent': 0,
              'hardware_profile': 'two_tank_transfer', 'level_sensor_model': 'AJ-SR04M',
              'receiver_capacity_l': 1.5, 'float_switch_role': 'receiver_full',
              'float_switch_state': 'stop_or_disconnected', 'transfer_permitted': False,
              'local_stop_reason': 'float_stop', 'relay_energized': False,
              'requested_valve_percent': 0,
          })
          assert stopped['mode'] == 'TRANSFER_STOPPED', stopped
          assert stopped['master_valve_percent'] == stopped['flat_valve_percent'] == 0
          for _ in range(20):
              if request('/health')['influx_pending'] == 0:
                  break
              time.sleep(1)
          bucket = json.dumps(values.get('INFLUX_BUCKET', 'water_telemetry'))
          query = f'from(bucket: {bucket}) |> range(start: -5m) |> filter(fn: (r) => r.device_id == "transfer-rig")'
          req = urllib.request.Request('http://127.0.0.1:8086/api/v2/query?org=' + urllib.parse.quote(values.get('INFLUX_ORG', 'waterwise')),
              data=json.dumps({'query': query}).encode(), headers={
                  'Authorization': 'Token ' + values['INFLUX_TOKEN'],
                  'Content-Type': 'application/json', 'Accept': 'application/csv'})
          with urllib.request.urlopen(req, timeout=15) as response:
              recorded = response.read().decode()
          assert 'float_stop' in recorded and 'transfer_permitted' in recorded and 'receiver_capacity_l' in recorded
          with urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=10) as response:
              assert json.load(response)['database'] == 'ok'
          print('MQTT, InfluxDB, Grafana, telemetry, leak decisions and recorded receiver float stop verified.')
      - name: Service status on failure
        if: failure()
        run: docker compose ps
      - name: Stop isolated services
        if: always()
        run: docker compose down -v
