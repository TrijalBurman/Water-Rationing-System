[platformio]
default_envs = esp32dev
core_dir = .platformio

[env:esp32dev]
platform = platformio/espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:select_config.py
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@6.21.5
build_flags = -Wall -Wextra
